name: release

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: '--target universal-apple-darwin'
                    - platform: windows-latest
                      args: ''

        runs-on: ${{ matrix.platform }}

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Generate release notes
              id: notes
              shell: bash
              run: |
                  LAST_TAG=$(git describe --tags --abbrev=0 --match 'app-v*' 2>/dev/null || echo "")
                  if [ -z "$LAST_TAG" ]; then
                    NOTES="Primera actualización automática publicada."
                  else
                    NOTES=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s" -- . ':!.github')
                    if [ -z "$NOTES" ]; then
                      NOTES="Cambios menores."
                    fi
                  fi
                  {
                    echo "notes<<NOTES_EOF"
                    echo "$NOTES"
                    echo "NOTES_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # Versión efímera para este release: se toma el major.minor ya committeado en
            # tauri.conf.json y se reemplaza el patch por el número de corrida de GitHub Actions
            # (siempre estrictamente mayor al anterior, sin bumpear nada a mano en el repo). El
            # version committeado del repo NO se toca — esto solo modifica el checkout efímero
            # del runner.
            - name: Set release version
              shell: bash
              run: |
                  node -e "
                    const fs = require('fs');
                    const p = 'src-tauri/tauri.conf.json';
                    const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                    const [major, minor] = c.version.split('.');
                    c.version = \`\${major}.\${minor}.${{ github.run_number }}\`;
                    fs.writeFileSync(p, JSON.stringify(c, null, 4));
                    console.log('Release version:', c.version);
                  "

            - name: Build and publish release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: app-v__VERSION__
                  releaseName: 'Habit Tracker v__VERSION__'
                  releaseBody: ${{ steps.notes.outputs.notes }}
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}
